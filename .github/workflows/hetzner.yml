name: Deploy Production (Hetzner)

on:
  push:
    branches: [main]

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Runtime Setup
        uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@26
          cache: true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint & check
        run: pnpm lint && pnpm astro:check --minimumFailingSeverity warning

      - name: Build (production)
        run: pnpm build
        env:
          SITE_URL: https://duo-ex-nihilo.de
          BASE_PATH: /

      - name: Install deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HETZNER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy
        run: rsync -az --delete dist/ deploy@${{ secrets.HETZNER_HOST }}:/var/www/exnihilo/
