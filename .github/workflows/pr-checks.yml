name: Check

on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Runtime Setup
        uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@26
          cache: true

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:read

      - run: pnpm lint && pnpm astro:check && pnpm build
        env:
          SITE_URL: https://duo-ex-nihilo.de
          BASE_PATH: /
